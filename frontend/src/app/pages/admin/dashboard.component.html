<div class="admin">
  <h2>Admin Dashboard</h2>

  <div class="add-box">
    <input placeholder="Product Name" [(ngModel)]="newProduct.name" />
    <input type="number" placeholder="Price" [(ngModel)]="newProduct.price" />
    <input placeholder="Category" [(ngModel)]="newProduct.category" />
    <button (click)="addProduct()">Add Product</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Category</th>
        <th></th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.name }}</td>
        <td>₹{{ p.price }}</td>
        <td>{{ p.category }}</td>
        <td>
          <button class="danger" (click)="deleteProduct(p.id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Admin Dashboard</h1>
  <form (ngSubmit)="addProduct()">
    <input [(ngModel)]="product.name" placeholder="Name" class="border p-2 m-1"/>
    <input [(ngModel)]="product.price" placeholder="Price" type="number" class="border p-2 m-1"/>
    <input [(ngModel)]="product.category" placeholder="Category" class="border p-2 m-1"/>
    <input type="file" (change)="onFileChange($event)" />
    <button class="bg-blue-500 text-white p-2 rounded">Add Product</button>
  </form>

  <div class="grid grid-cols-4 gap-4 mt-6">
    <div *ngFor="let p of products" class="border p-2">
      <img [src]="p.imageUrl" class="h-32 w-full object-cover"/>
      <h3>{{p.name}}</h3>
      <p>{{p.price | currency}}</p>
      <button (click)="editProduct(p)">Edit</button>
      <button (click)="deleteProduct(p.id)">Delete</button>
    </div>
  </div>
</div>

</div>
