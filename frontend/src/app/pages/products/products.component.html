<div class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-semibold text-[#3b2f2f]">Our Products</h2>
    <select
      (change)="onCategoryChange($event)"
      class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#c2a060]"
    >
      <option value="">All Categories</option>
      <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
    </select>
  </div>

  <div *ngIf="loading" class="text-center text-gray-500 mt-4">
    Loading products...
  </div>

  <div
    *ngIf="!loading && products.length"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-4"
  >
    <div
      *ngFor="let product of products"
      class="bg-white rounded-xl shadow hover:shadow-lg transition p-4 flex flex-col"
    >
      <app-product-card [product]="product"></app-product-card>
      <button
        (click)="addToCart(product)"
        class="mt-4 bg-[#3b2f2f] text-white px-4 py-2 rounded-lg hover:bg-[#2a2222] transition"
      >
        Add to Cart
      </button>
    </div>
  </div>

  <div *ngIf="!loading && products.length === 0" class="text-center text-gray-500 mt-4">
    No products found.
  </div>

  <div *ngIf="error" class="text-red-500 mt-4">{{ error }}</div>
</div>
