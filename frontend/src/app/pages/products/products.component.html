<div class="max-w-7xl mx-auto px-4 py-6">
  <select (change)="onCategoryChange($event)">
    <option value="">All Categories</option>
    <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
  </select>

  <div *ngIf="loading" class="text-center text-gray-500 mt-4">
    Loading products...
  </div>

  <div *ngIf="!loading && products.length" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-4">
    <div *ngFor="let product of products" class="border p-4 rounded shadow hover:shadow-lg transition">
      <img [src]="product.imageUrl" alt="{{ product.name }}" class="w-full h-48 object-cover rounded mb-3"/>
      <h3 class="font-semibold text-lg">{{ product.name }}</h3>
      <p class="text-sm text-gray-600">₹ {{ product.price }}</p>
      <button (click)="addToCart(product)" class="mt-3 bg-[#3b2f2f] text-white px-4 py-2 rounded hover:bg-[#2a2222]">
        Add to Cart
      </button>
    </div>
  </div>

  <div *ngIf="!loading && products.length === 0" class="text-center text-gray-500 mt-4">
    No products found.
  </div>

  <div *ngIf="error" class="text-red-500 mt-4">{{ error }}</div>
</div>
