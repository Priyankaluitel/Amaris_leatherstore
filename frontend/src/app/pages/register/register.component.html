<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h2 class="text-3xl font-semibold text-center text-brownDark mb-2">
      Create an account
    </h2>
    <p class="text-center text-gray-500 mb-6">
      Join Amaris Leather to shop and manage your orders.
    </p>

    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="mb-4">
        <label class="block text-brownDark mb-1 font-medium">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
        />
        <div
          *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Please enter a valid email.
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-brownDark mb-1 font-medium">Password</label>
        <input
          type="password"
          formControlName="password"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
        />
        <div
          *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-brownDark mb-1 font-medium">Confirm Password</label>
        <input
          type="password"
          formControlName="confirmPassword"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
        />
        <div
          *ngIf="
            registerForm.errors?.['passwordMismatch'] &&
            registerForm.get('confirmPassword')?.touched
          "
          class="text-red-500 text-sm mt-1"
        >
          Passwords do not match.
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-brownDark mb-1 font-medium">Account Type</label>
        <select
          formControlName="role"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
        >
          <option value="CUSTOMER">Customer</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full bg-brownDark text-white py-2 rounded-lg hover:bg-opacity-90 transition disabled:opacity-50"
      >
        Register
      </button>

      <div *ngIf="error" class="text-red-500 text-sm mt-2 text-center">
        {{ error }}
      </div>
    </form>
  </div>
</div>
