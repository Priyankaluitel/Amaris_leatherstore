<div class="min-h-screen bg-gray-50 py-10 px-4">
  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-6">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h2 class="text-2xl font-semibold text-brownDark">Your Orders</h2>
        <p class="text-sm text-gray-500">Track your purchases and download invoices.</p>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full text-left text-sm">
        <thead class="border-b bg-gray-100 text-gray-700">
          <tr>
            <th class="px-4 py-3">Order ID</th>
            <th class="px-4 py-3">Total</th>
            <th class="px-4 py-3">Status</th>
            <th class="px-4 py-3">Payment</th>
            <th class="px-4 py-3">Date</th>
            <th class="px-4 py-3 text-right">Invoice</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let order of orders"
            class="border-b last:border-0 hover:bg-gray-50 transition"
          >
            <td class="px-4 py-3 font-medium text-gray-800">
              #{{ order.id }}
            </td>
            <td class="px-4 py-3 text-gray-900">
              {{ order.total | currency }}
            </td>
            <td class="px-4 py-3">
              <span
                class="inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold"
                [ngClass]="{
                  'bg-green-100 text-green-700': order.status === 'DELIVERED',
                  'bg-yellow-100 text-yellow-700': order.status === 'PENDING',
                  'bg-red-100 text-red-700': order.status === 'CANCELLED'
                }"
              >
                {{ order.status }}
              </span>
            </td>
            <td class="px-4 py-3 text-gray-700">
              {{ order.paymentMethod }} ({{ order.paymentStatus }})
            </td>
            <td class="px-4 py-3 text-gray-600">
              {{ order.createdAt | date: 'medium' }}
            </td>
            <td class="px-4 py-3 text-right">
              <button
                type="button"
                (click)="viewInvoice(order)"
                class="inline-flex items-center rounded-full border border-[#c2a060] px-4 py-1 text-xs font-medium text-[#3b2f2f] hover:bg-[#c2a060] hover:text-white transition"
              >
                View Invoice
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
