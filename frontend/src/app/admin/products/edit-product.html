<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6 mt-8">
    <h2 class="text-2xl font-semibold text-brownDark mb-4">Edit Product</h2>

    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
                [(ngModel)]="product.name" name="name" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Price</label>
            <input type="number"
                class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
                [(ngModel)]="product.price" name="price" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
            <input type="number"
                class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
                [(ngModel)]="product.stock" name="stock" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
                [(ngModel)]="product.category" name="category">
                <option value="BAGS">Bags</option>
                <option value="WALLETS">Wallets</option>
                <option value="BELTS">Belts</option>
                <option value="ACCESSORIES">Accessories</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
            <input class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
                [(ngModel)]="product.imageUrl" name="imageUrl" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Introduction</label>
            <input class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
                [(ngModel)]="product.introduction" name="introduction" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brownLight"
                [(ngModel)]="product.description" name="description" rows="3"></textarea>
        </div>

        <div class="flex space-x-4">
            <button (click)="updateProduct()"
                class="bg-[#3b2f2f] text-white px-6 py-2 rounded-lg hover:bg-[#2a2222] transition">
                Update Product
            </button>
            <button routerLink="/admin/products"
                class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">
                Cancel
            </button>
        </div>
    </div>
</div>
